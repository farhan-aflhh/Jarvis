name: Build Jarvis app

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build APK
        run: gradle -p android :app:assembleDebug --no-daemon --stacktrace
      - name: Publish download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk jarvis.apk
          gh release delete app --cleanup-tag -y || true
          gh release create app jarvis.apk --title "Jarvis app" --notes "Built from ${GITHUB_SHA::7}" --latest
